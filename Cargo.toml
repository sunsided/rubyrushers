[workspace]
members = ["game", "bot"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
authors = ["Markus Mayer"]
repository = "https://github.com/sunsided/rubyrushers"

[workspace.dependencies]
game-toolkit = "0.11"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Cell indices, pixels, scores and frame counts stay far below 2^23, so int-to-float casts
# are exact; flagging every one would bury the casts that can actually lose something.
cast_precision_loss = "allow"
missing_docs_in_private_items = "warn"
dbg_macro = "warn"
todo = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

# Light optimization for our own code, full for dependencies: playable debug builds that
# still compile fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
