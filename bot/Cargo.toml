[package]
name = "rubyrushers-bot"
version = "0.1.0"
description = "Plays RubyRushers from screenshots alone: finds the board, reads the gems, picks a move, clicks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
# The --watch window. The toolkit only: the bot still never links the game.
game-toolkit.workspace = true
png = "0.18"
serde_json = "1"
tungstenite = "0.29"

# Only the accuracy harness looks at the game's own state, to grade what the bot saw.
# The bot itself never links the game.
[dev-dependencies]
rubyrushers = { path = "../game" }

[lints]
workspace = true
