[package]
name = "rubyrushers"
version = "0.1.0"
description = "A fast match-three gem game on game-toolkit: a 60-second rush and an endless mode."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
game-toolkit = { workspace = true, features = ["synth"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# The browser: prefers-reduced-motion picks calm effects, local storage keeps the best
# scores, the clock seeds the boards, the query string sets the start options.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "MediaQueryList", "Storage", "Window"] }

[lints]
workspace = true
