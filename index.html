<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RubyRushers</title>
    <!-- trunk: build the game crate to wasm (rubyrushers.js, rubyrushers_bg.wasm). -->
    <link data-trunk rel="rust" href="game/Cargo.toml" data-bin="rubyrushers" />
    <link data-trunk rel="copy-file" href="LICENSE" />
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      body { display: flex; align-items: center; justify-content: center; }
      /* touch-action: none hands touches to the game instead of letting the browser
         scroll or zoom (and cancel them). */
      canvas { outline: none; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- The game binds to this id; games.markusmayer.dev creates a canvas of the same id. -->
    <canvas id="rubyrushers" tabindex="0"></canvas>
  </body>
</html>
